name: Sideload Release

on:
  release:
    types: [published]
  # Manual re-run against an existing release tag — e.g. when a runner-side
  # build issue (missing Metal toolchain, transient SPM checkout) failed the
  # original release-triggered run. Builds the tagged code and attaches the
  # sideload assets to that release without re-cutting or moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build sideload assets for (e.g. v1.2.0)
        required: true
      engine_ref:
        description: StreamenEngine ref to build against (defaults to the pinned version)
        required: false
      recorder_ref:
        description: StreamenDVR ref to build against (defaults to the pinned version)
        required: false
      cloud_ref:
        description: StreamenCloud ref to build against (defaults to the pinned version)
        required: false

# The build jobs attach assets to the release, which requires write access to
# repo contents. The default GITHUB_TOKEN is read-only when the repo's default
# workflow permissions are restricted, causing "Resource not accessible by
# integration" on upload.
permissions:
  contents: write

# Resolved once and shared by every step (incl. checkout ref). On a release
# event this is the published tag; on manual dispatch it's the input.
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
  # StreamenEngine (the beta 4th playback engine) is referenced by the project as a
  # *local* SPM package at ../StreamenEngine, so the sibling repo has to exist on the
  # runner or `xcodebuild archive` dies at "Could not resolve package
  # dependencies" before compiling anything.
  #
  # Pinned rather than tracking the engine's main: app↔engine commits are paired
  # by hand, so a drifting engine would break this archive with no change on
  # Streamen's side. Bump this when a release needs newer engine code.
  ENGINE_REF: ${{ github.event.inputs.engine_ref || 'dustin-custom-v2' }}
  # StreamenDVRKit (the DVR client) is the same story: a local package at
  # ../StreamenDVR/Kit, pinned to the StreamenDVR tag the app was built with.
  RECORDER_REF: ${{ github.event.inputs.recorder_ref || 'dustin-custom-v2' }}
  # StreamenCloudKit (the Streamen Cloud sync client) likewise: a local package at
  # ../StreamenCloud/StreamenCloudKit. Tracks main until StreamenCloud cuts its first tag.
  CLOUD_REF: ${{ github.event.inputs.cloud_ref || 'dustin-custom-v2' }}

jobs:
  build:
    name: Build ${{ matrix.platform }} Sideload
    # Must build with the same Xcode major as the App Store archives
    # (ship-release, local Xcode 27): the linked SDK decides SDK-gated behaviour
    # such as iPhone Duo layout — an iOS 26 SDK IPA runs in compatibility mode
    # there. macos-26 only ships Xcode 26, so use the xcode-27 image (macOS 27).
    # (Never macos-15: the macOS icon's AssetCatalogAgent compile crashes there
    # with a dyld MediaToolbox/AVFCore symbol mismatch.) iOS/tvOS build here
    # too, so all platforms share one image.
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
            format: ipa
          - platform: tvOS
            destination: generic/platform=tvOS
            format: ipa
          - platform: macOS
            destination: generic/platform=macOS
            format: zip

    # Every `run` step works inside the app checkout (see the sibling-layout note
    # on the checkout steps). Packaging steps use absolute $RUNNER_TEMP paths and
    # are unaffected.
    defaults:
      run:
        working-directory: Streamen

    steps:
      # Streamen, StreamenEngine, StreamenDVR and StreamenCloud are checked out as
      # *siblings* rather than the app sitting at the workspace root, because the
      # project references the engine and the two kits by relative path
      # (../StreamenEngine, ../StreamenDVR/Kit, ../StreamenCloud/StreamenCloudKit) and
      # actions/checkout refuses any `path` outside $GITHUB_WORKSPACE. All four
      # therefore live one level down inside it.
      - name: Checkout Streamen
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: Streamen

      # No FFmpeg build needed: with BinaryDependencies/ absent (it's gitignored,
      # so a fresh clone never has it) the engine's Package.swift falls back to a
      # checksum-pinned FFmpeg.xcframework downloaded from a GitHub release.
      - name: Checkout StreamenEngine
        uses: actions/checkout@v5
        with:
          repository: dustintinsley/StreamenEngine
          ref: ${{ env.ENGINE_REF }}
          path: StreamenEngine

      - name: Checkout StreamenDVR
        uses: actions/checkout@v5
        with:
          repository: dustintinsley/StreamenDVR
          ref: ${{ env.RECORDER_REF }}
          path: StreamenDVR

      - name: Checkout StreamenCloud
        uses: actions/checkout@v5
        with:
          repository: dustintinsley/StreamenCloud
          ref: ${{ env.CLOUD_REF }}
          path: StreamenCloud

      # Pinned, not latest-stable: latest-stable silently fell back to Xcode 26
      # (iOS 26.5 SDK) while the App Store build used 27. Keep this on the
      # Xcode ship-release archives with; bump both together.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      # ── Metal Toolchain ──────────────────────────────────────────────────────
      # Xcode 26 no longer bundles the Metal toolchain; without it KSPlayer's
      # Shaders.metal fails to compile ("cannot execute tool 'metal' due to
      # missing Metal Toolchain"). Download it before archiving.
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # ── Inject API key secrets (optional) ───────────────────────────────────
      # Features degrade gracefully when absent (see Scripts/inject-env.sh).
      - name: Write .env
        env:
          # Key names MUST match what Scripts/inject-env.sh reads (read_env …).
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          INTRO_DB_API_KEY: ${{ secrets.INTRO_DB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: |
          {
            [ -n "$TMDB_ACCESS_TOKEN" ]     && echo "TMDB_ACCESS_TOKEN=$TMDB_ACCESS_TOKEN"
            [ -n "$MDBLIST_API_KEY" ]       && echo "MDBLIST_API_KEY=$MDBLIST_API_KEY"
            [ -n "$INTRO_DB_API_KEY" ]      && echo "INTRO_DB_API_KEY=$INTRO_DB_API_KEY"
            [ -n "$OPENSUBTITLES_API_KEY" ] && echo "OPENSUBTITLES_API_KEY=$OPENSUBTITLES_API_KEY"
            [ -n "$TRAKT_CLIENT_ID" ]       && echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            [ -n "$TRAKT_CLIENT_SECRET" ]   && echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET"
            [ -n "$SIMKL_CLIENT_ID" ]       && echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID"
            [ -n "$SIMKL_CLIENT_SECRET" ]   && echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET"
            [ -n "$MDBLIST_CLIENT_ID" ]     && echo "MDBLIST_CLIENT_ID=$MDBLIST_CLIENT_ID"
          } > .env || true

      # ── Archive (unsigned) ───────────────────────────────────────────────────
      # CODE_SIGNING_ALLOWED=NO skips all signing. The resulting .app is unsigned;
      # users re-sign it themselves (iOS/tvOS via AltStore/Sideloadly,
      # macOS via right-click → Open to bypass Gatekeeper).
      - name: Archive (Sideload, unsigned)
        run: |
          xcodebuild archive \
            -project Streamen.xcodeproj \
            -scheme Streamen \
            -configuration Sideload \
            -destination '${{ matrix.destination }}' \
            -archivePath "$RUNNER_TEMP/Streamen-Sideload.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO

      # ── Package: IPA (iOS / tvOS) ────────────────────────────────────────────
      # An IPA is a zip with Payload/<AppName>.app at its root.
      - name: Package IPA
        if: matrix.format == 'ipa'
        run: |
          VERSION="$RELEASE_TAG"
          APP=$(find "$RUNNER_TEMP/Streamen-Sideload.xcarchive/Products" -name "*.app" | head -1)

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/Streamen-${VERSION}-${{ matrix.platform }}-Sideload.ipa" Payload

      # ── Package: zip (macOS) ────────────────────────────────────────────────
      # ditto preserves symlinks and resource forks inside the .app bundle.
      # plain zip would break the bundle's internal structure.
      - name: Package zip
        if: matrix.format == 'zip'
        run: |
          VERSION="$RELEASE_TAG"
          APP=$(find "$RUNNER_TEMP/Streamen-Sideload.xcarchive/Products" -name "*.app" | head -1)

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$RUNNER_TEMP/Streamen-${VERSION}-macOS-Sideload.zip"

      # ── Attach to release ────────────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ runner.temp }}/Streamen-${{ env.RELEASE_TAG }}-${{ matrix.platform }}-Sideload.${{ matrix.format }}
